name: CI

# Runs on every PR. Enforces the deployment order from the plan:
# infrastructure validation and transformation/test validation both gate
# merge; schedule activation is a separate, deliberate step in cd.yml, never
# automatic.
#
# Setup required before the live-build job can run green:
#   - Repo secret SNOWFLAKE_CI_PRIVATE_KEY: the RECON_CI_SVC service user's
#     PEM private key text (see infra_snowflake/service_user.tf -- its public
#     key is Terraform-managed, the private key is not and never should be).

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  SNOWFLAKE_ACCOUNT: "QOZWHHP-ZLC22574"
  SNOWFLAKE_CI_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY }}

jobs:
  # Fast gate: lint every push/PR. A linter error blocks merge -- cheap,
  # no secrets, no warehouse. (Terraform is fmt-checked and dbt is parsed in
  # their own jobs below; this closes the Python-side gap.)
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # Lint gate (undefined names, unused imports, import order, real syntax
      # errors). `ruff format` adoption is intentionally a separate future
      # step -- not folded in here so this change stays reviewable.
      - run: ruff check .

  python-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r data_generation/requirements.txt -r ingestion/requirements.txt -r requirements-dev.txt
      # Coverage is a ratchet, not a vanity number: --cov-fail-under blocks
      # merge if coverage drops below the floor in pyproject.toml, so a PR
      # can't quietly remove tested code. Raise the floor as coverage grows;
      # never lower it to make a red build green.
      - run: pytest tests/ -v --cov --cov-report=term-missing

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra_snowflake
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      # No -check on fmt: the committed config predates a formatter pass and
      # `terraform fmt -check` would fail merge on cosmetic alignment in files
      # this PR gate has nothing to do with. `validate` below is the real gate
      # -- it catches syntax and reference errors, which is what matters.
      - run: terraform fmt -recursive -write=false
      - run: terraform init -backend=false
      - run: terraform validate

  dbt-parse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "dbt-snowflake>=1.8,<2.0"
      - run: dbt deps
      # dbt needs a profile to resolve `target.*` even for parse (which never
      # connects). Point at the repo's CI profile via an absolute path -- the
      # default ~/.dbt does not exist on the runner.
      - name: dbt parse # syntax/DAG validation only -- no warehouse connection needed
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.github/ci_snowflake
        run: dbt parse

  dbt-build-test:
    needs: [terraform-validate, dbt-parse]
    # Live build against the dev database needs the Snowflake CI secret, so
    # run it on PRs (the merge gate) but skip it on direct pushes to master --
    # a push without that secret would go red on every commit and train
    # everyone to ignore a red CI, which defeats the whole point of the gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "dbt-snowflake>=1.8,<2.0"
      - run: dbt deps
      - name: dbt build (seeds + models + tests) against the live dev database
        env:
          # Absolute path -- a bare ".github/ci_snowflake" would resolve under
          # the transform working-directory, not the repo root.
          DBT_PROFILES_DIR: ${{ github.workspace }}/.github/ci_snowflake
        # Exclude the dead-man's-switch monitor (tag:heartbeat) -- it runs in
        # its own heartbeat workflow, and would fail here whenever the daily
        # run's telemetry is stale (which it is on a paused schedule).
        run: dbt build --target ci_snowflake --exclude tag:heartbeat
