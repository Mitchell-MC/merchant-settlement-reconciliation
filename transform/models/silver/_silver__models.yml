version: 2

models:
  - name: dim_merchant
    description: >
      Conformed merchant dimension -- CURRENT state only. For a merchant's
      risk_tier/fee/speed attributes as of a past date, use
      dim_merchant_history instead (backed by the dim_merchant_snapshot
      SCD2 snapshot).
    columns:
      - name: merchant_id
        tests: [unique, not_null]
      # Silver is the enforcement/rejection gate for these categorical
      # attributes -- default (error) severity, unlike the matching
      # detection-only (severity: warn) tests on bronze.merchants in
      # _bronze__sources.yml. An unrecognised value here fails the build
      # rather than silently flowing into risk_tier-driven fee/reserve logic.
      - name: industry
        tests:
          - accepted_values:
              values: ['health_wellness', 'professional_services', 'restaurant_food_service',
                'retail', 'auto_services', 'home_trade_services', 'other', 'ecommerce_online_retail']
      - name: mcc
        tests:
          - accepted_values:
              values: ['8099', '8742', '5812', '5311', '7538', '1731', '5999', '5964']
      - name: region
        tests:
          - accepted_values:
              values: ['South', 'West', 'Midwest', 'Northeast']
      - name: employer_size_class
        tests:
          - accepted_values:
              values: ['1-4', '5-9', '10-19', '20-49', '50-99', '100-249', '250-499', '500+']
      - name: risk_tier
        tests:
          - accepted_values:
              values: ['standard', 'elevated', 'high']
      - name: settlement_speed_business_days
        tests:
          - accepted_values:
              values: [1, 2]

  - name: dim_merchant_history
    description: >
      Point-in-time merchant attributes (SCD2), one row per
      (merchant_id, valid_from..valid_to) version. Built from
      dim_merchant_snapshot. Use this -- not dim_merchant -- whenever a
      consumer needs "what was true about this merchant as of date X"
      rather than "what is true about this merchant right now."
    columns:
      - name: merchant_id
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: valid_to
        tests: [not_null]
      - name: industry
        tests:
          - accepted_values:
              values: ['health_wellness', 'professional_services', 'restaurant_food_service',
                'retail', 'auto_services', 'home_trade_services', 'other', 'ecommerce_online_retail']
      - name: mcc
        tests:
          - accepted_values:
              values: ['8099', '8742', '5812', '5311', '7538', '1731', '5999', '5964']
      - name: region
        tests:
          - accepted_values:
              values: ['South', 'West', 'Midwest', 'Northeast']
      - name: employer_size_class
        tests:
          - accepted_values:
              values: ['1-4', '5-9', '10-19', '20-49', '50-99', '100-249', '250-499', '500+']
      - name: risk_tier
        tests:
          - accepted_values:
              values: ['standard', 'elevated', 'high']
      - name: settlement_speed_business_days
        tests:
          - accepted_values:
              values: [1, 2]

  - name: dim_date
    description: Date spine with US Federal Reserve holiday calendar and business-day sequencing.
    columns:
      - name: date_day
        tests: [unique, not_null]

  - name: dim_payment_channel
    description: Payment channel dimension.
    columns:
      - name: payment_channel
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['card_present', 'ecommerce']
      # 'Other' is the catch-all in the model's case expression -- if a new
      # channel appears upstream it lands there rather than erroring, so this
      # test is what makes that fallback visible instead of silent.
      - name: payment_channel_group
        tests:
          - not_null
          - accepted_values:
              values: ['In-Person', 'Online', 'Other']

  - name: fct_transaction
    description: Conformed transaction-level fact.
    columns:
      - name: transaction_id
        tests: [unique, not_null]
      - name: merchant_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_merchant')
              field: merchant_id
      - name: transaction_type
        tests:
          - accepted_values:
              values: ['sale', 'refund']
      - name: payment_channel
        tests:
          - accepted_values:
              values: ['card_present', 'ecommerce']

  - name: fct_settlement_batch
    description: Conformed settlement batch fact -- the "expected settlement" side of reconciliation.
    tests:
      # KPI contract #1 is the arithmetic every downstream number inherits:
      # break amounts, cash-at-risk, and funding cost are all differences
      # against expected_settlement_amount. If a fee or reserve component is
      # ever dropped from the Bronze rollup, the total silently shifts and
      # every KPI moves with it -- with no null, no duplicate, and no row-count
      # change for the other tests to catch. This asserts the formula as
      # written in docs/kpi_contract.md #1, per row.
      #
      # Tolerance is 0.01 (one cent), not exact equality: the components are
      # DECIMAL(18,2) and the comparison is against a stored total, so a
      # half-cent rounding difference is arithmetic noise, not a real defect.
      # Measured max deviation on the current dataset is exactly 0.00.
      - dbt_utils.expression_is_true:
          expression: >
            abs(expected_settlement_amount - (gross_sales_volume - same_day_refunds
            - interchange_fees - network_fees - processing_fees
            - reserve_held + reserve_released - returns_adjustments_amount)) < 0.01
          config:
            store_failures: true
            limit: 500
    columns:
      - name: settlement_batch_id
        tests: [unique, not_null]
      - name: expected_settlement_amount
        tests: [not_null]

  - name: fct_bank_movement
    description: Conformed bank posting fact -- the "actual cash" side of reconciliation.
    columns:
      - name: posting_id
        tests: [unique, not_null]

  - name: fct_duplicate_postings
    description: >
      Bank postings never claimed by the reconciliation engine that share
      merchant/date/amount with a posting that WAS claimed -- a duplicate
      payout, not a settlement-batch-side break. See
      transform/tests/assert_duplicate_postings_are_unclaimed.sql for the
      integrity check that this model never overlaps a true match.
    columns:
      - name: unclaimed_posting_id
        tests: [unique, not_null]
      - name: duplicated_posting_id
        tests: [not_null]
      - name: duplicated_against_batch_id
        tests: [not_null]

  - name: fct_reserve_event
    description: Conformed reserve hold/release ledger.
    columns:
      - name: merchant_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_merchant')
              field: merchant_id
      # Reserve holds and releases feed KPI #1 with opposite signs, so an
      # unrecognised third value would be silently dropped from (or wrongly
      # added to) expected settlement by the rollup's case expression.
      # No surrogate key exists on this table, so there is nothing to test
      # `unique` against -- the grain is the event stream itself.
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              values: ['hold', 'release']
      - name: amount
        tests: [not_null]

  - name: fct_returns_adjustment
    description: Conformed lagged return/chargeback/dispute adjustments.
    columns:
      - name: adjustment_id
        tests: [unique, not_null]
      - name: reason_code
        tests:
          - accepted_values:
              values: ['chargeback', 'customer_return', 'billing_dispute']

  - name: int_reconciliation_matches
    description: >
      The reconciliation engine's output -- one row per settlement batch,
      with its matched bank posting(s) (if any) and match/break status.
    tests:
      # The engine joins batches to postings, so a fan-out here would silently
      # double-count cash. `unique` on settlement_batch_id below catches the
      # duplicate rows a fan-out produces, but only after the fact and without
      # naming the cause; this asserts the grain contract directly -- exactly
      # one output row per input batch, no more and no fewer. A drop (batches
      # lost to an inner join that should have been a left join) is just as
      # much a defect as a duplication, and `unique` cannot see it at all.
      - dbt_utils.equal_rowcount:
          compare_model: ref('fct_settlement_batch')
    columns:
      - name: settlement_batch_id
        tests: [unique, not_null]
      - name: is_matched
        tests: [not_null]
